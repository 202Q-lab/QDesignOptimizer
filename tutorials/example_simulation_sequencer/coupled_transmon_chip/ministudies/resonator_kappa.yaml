# A resonator's linewidth into the feedline, from a capacitance study
# (Q3D, a few minutes) -- the fast one to run first.
#
# {n} is a subsystem's value (simulations/sequencer.py, subjects), so this
# one file makes a study per subsystem: Q1.resonator_kappa and
# Q2.resonator_kappa. "=p[...]" is read from parameter_targets.py when the
# study is queued: the decay depends on the frequency the resonator is
# meant to have.
class: qdesignoptimizer.design_analysis_types:MiniStudy
args:
  qiskit_component_names: ["name_resonator_{n}_", "name_tee_{n}_"]
  port_list: []
  open_pins: []
  modes: ["resonator_{n}"]
  jj_setup: {}
  design_name: "resonator_kappa_{n}"
  adjustment_rate: 1
  run_capacitance_studies_only: true
  nbr_passes: 7
  delta_f: 0.03
  capacitance_matrix_studies:
  - class: qdesignoptimizer.sim_capacitance_matrix:ResonatorDecayIntoWaveguideStudy
    args:
      mode: "resonator_{n}"
      mode_freq_GHz: "=p['resonator_{n}_freq'] / 1e9"
      # Names of the conductors in the Ansys model list.
      resonator_name: "second_cpw_name_tee_{n}_"
      waveguide_name: "prime_cpw_name_tee_{n}_"
      impedance_ohm: 50
      resonator_type: lambda_4
      qiskit_component_names: ["name_resonator_{n}_", "name_tee_{n}_"]
      open_pins:
      - ["name_resonator_{n}_", start]
      - ["name_resonator_{n}_", end]
      - ["name_tee_{n}_", prime_end]
      - ["name_tee_{n}_", prime_start]
      nbr_passes: 8
      render_qiskit_metal_kwargs: {capacitance_or_surface_p_ratio: true}
