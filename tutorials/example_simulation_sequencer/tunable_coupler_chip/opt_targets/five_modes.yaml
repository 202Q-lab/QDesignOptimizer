# The notebook's OptTargets (get_opt_targets_2qubits_resonator_coupler
# with every target but the resonator linewidth), one entry each.
#
# tolerance: how close the last iteration must come for the "converged"
# check -- relative, or {abs: ...} in the parameter's unit.
targets:
- name: Q1_freq
  helper: qdesignoptimizer.utils.optimization_targets:get_opt_target_qubit_freq_via_lj
  args: {qubit: qubit_1}
  tolerance: {abs: 20.0e+6}   # Hz
- name: Q2_freq
  helper: qdesignoptimizer.utils.optimization_targets:get_opt_target_qubit_freq_via_lj
  args: {qubit: qubit_2}
  tolerance: {abs: 20.0e+6}
- name: Q1_anharmonicity
  helper: qdesignoptimizer.utils.optimization_targets:get_opt_target_qubit_anharmonicity_via_capacitance_width
  args:
    qubit: qubit_1
    design_var_constraint: {larger_than: 1um, smaller_than: 900um}
  tolerance: 0.05
- name: Q2_anharmonicity
  helper: qdesignoptimizer.utils.optimization_targets:get_opt_target_qubit_anharmonicity_via_capacitance_width
  args:
    qubit: qubit_2
    design_var_constraint: {larger_than: 1um, smaller_than: 900um}
  tolerance: 0.05
- name: R1_freq
  helper: qdesignoptimizer.utils.optimization_targets:get_opt_target_res_freq_via_length
  args: {resonator: resonator_1}
  tolerance: {abs: 10.0e+6}
- name: R2_freq
  helper: qdesignoptimizer.utils.optimization_targets:get_opt_target_res_freq_via_length
  args: {resonator: resonator_2}
  tolerance: {abs: 10.0e+6}
- name: Q1_R1_chi
  helper: qdesignoptimizer.utils.optimization_targets:get_opt_target_res_qub_chi_via_coupl_length
  args:
    qubit: qubit_1
    resonator: resonator_1
    design_var_constraint: {larger_than: 1um, smaller_than: 80um}
  tolerance: 0.1
- name: Q2_R2_chi
  helper: qdesignoptimizer.utils.optimization_targets:get_opt_target_res_qub_chi_via_coupl_length
  args:
    qubit: qubit_2
    resonator: resonator_2
    design_var_constraint: {larger_than: 1um, smaller_than: 80um}
  tolerance: 0.1

# The coupler is a transmon too: its frequency from its junction, its
# anharmonicity from its capacitor's length (in place of a pad width).
- name: C_freq
  helper: qdesignoptimizer.utils.optimization_targets:get_opt_target_qubit_freq_via_lj
  args:
    qubit: coupler_1to2
    design_var_qubit_width: {ref: "qdesignoptimizer.utils.names_design_variables:design_var_length"}
  tolerance: {abs: 20.0e+6}
- name: C_anharmonicity
  helper: qdesignoptimizer.utils.optimization_targets:get_opt_target_qubit_anharmonicity_via_capacitance_width
  args:
    qubit: coupler_1to2
    design_var_qubit_width: {ref: "qdesignoptimizer.utils.names_design_variables:design_var_length"}
  tolerance: 0.05

# Coupler-qubit chi, written out as the notebook's optimization_targets.py
# has it: the design variable is the qubit's distance from the coupler.
- name: C_Q1_chi
  target_param_type: nonlinearity
  involved_modes: [coupler_1to2, qubit_1]
  design_var: design_var_coupl_length_coupler_1to2_qubit_1
  design_var_constraint: {larger_than: 1um, smaller_than: 80um}
  prop_to: "1 / v['design_var_coupl_length_coupler_1to2_qubit_1'] / (p['coupler_1to2_freq'] - p['qubit_1_freq'])"
  independent_target: true
  tolerance: 0.1
- name: C_Q2_chi
  target_param_type: nonlinearity
  involved_modes: [coupler_1to2, qubit_2]
  design_var: design_var_coupl_length_coupler_1to2_qubit_2
  design_var_constraint: {larger_than: 1um, smaller_than: 80um}
  prop_to: "1 / v['design_var_coupl_length_coupler_1to2_qubit_2'] / (p['coupler_1to2_freq'] - p['qubit_2_freq'])"
  independent_target: true
  tolerance: 0.1
