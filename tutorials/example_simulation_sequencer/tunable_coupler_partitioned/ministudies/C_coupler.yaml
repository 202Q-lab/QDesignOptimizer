# Partition "qb_cplr_qb" of the notebook
# main_eigenmode_two_qubit_resonator_partitioned.ipynb: both qubits and
# the coupler between them, without the resonators. It tunes the coupler
# only -- its frequency, anharmonicity and its chi to each qubit (the
# targets with {coupler}); the qubits are tuned by Q1.readout and
# Q2.readout. The notebook's solver settings: 15 passes, delta_f 0.001.
#
# Modes in order of their target frequency.
class: qdesignoptimizer.design_analysis_types:MiniStudy
args:
  qiskit_component_names: [name_qubit_1_, name_qubit_2_, name_coupler_1to2_]
  port_list: []
  open_pins: []
  modes: [qubit_2, qubit_1, coupler_1to2]
  jj_setup:
    jj_name_qubit_1_:
      rect: JJ_rect_Lj_name_qubit_1__rect_jj
      line: JJ_Lj_name_qubit_1__rect_jj_
      Lj_variable: design_var_lj_qubit_1
      Cj_variable: design_var_cj_qubit_1
    jj_name_qubit_2_:
      rect: JJ_rect_Lj_name_qubit_2__rect_jj
      line: JJ_Lj_name_qubit_2__rect_jj_
      Lj_variable: design_var_lj_qubit_2
      Cj_variable: design_var_cj_qubit_2
    jj_name_coupler_1to2_:
      rect: JJ_rect_Lj_name_coupler_1to2__rect_jj
      line: JJ_Lj_name_coupler_1to2__rect_jj_
      Lj_variable: design_var_lj_coupler_1to2
      Cj_variable: design_var_cj_coupler_1to2
  design_name: C_coupler
  adjustment_rate: 1
  cos_trunc: 6
  fock_trunc: 5
  build_fine_mesh: false
  nbr_passes: 15
  delta_f: 0.001
